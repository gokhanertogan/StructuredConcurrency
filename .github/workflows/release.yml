name: Release

# Pushing a tag such as v0.2.0 tests, packs and publishes that version to nuget.org,
# then creates a GitHub release with the packages attached, and publishes them to GitHub Packages.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # For GitHub Packages.
      packages: write
      # For NuGet trusted publishing: the job proves to nuget.org which repo and workflow it is.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test -c Release
      - name: Check the tag matches the package version
        run: |
          version=$(dotnet msbuild src/StructuredConcurrency -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi
      # The release notes are this version's section of CHANGELOG.md, from its "## x.y.z" heading to the next one.
      # Checked before anything is published, so a missing section stops the release instead of leaving it half done.
      - name: Read the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no '## $version' section"
            exit 1
          fi
      - run: dotnet pack src/StructuredConcurrency -c Release -o artifacts
      - run: dotnet pack src/StructuredConcurrency.Hosting -c Release -o artifacts
      # Trusted publishing: trades the job's OIDC token for an API key that expires within the hour, so there is no
      # long-lived key to store or renew. The policy on nuget.org names this repo and release.yml.
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: GokhanErtogan
      # Also pushes the .snupkg symbols package next to each .nupkg.
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      # Also on GitHub Packages, so the packages show on the repository page; nuget.org stays the source people install
      # from. Last, so a problem here can't hold up the release. GitHub Packages takes no .snupkg symbols packages.
      - name: Publish to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$GH_TOKEN" --source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" --skip-duplicate --no-symbols
        env:
          GH_TOKEN: ${{ github.token }}
