name: Action

# Runs the GitHub Action in action.yml on the projects in action/test/ and checks what it reports. It runs the analyzers
# built from this commit, not a released package, so a change to them is tested through the action too.
on:
  push:
    branches: [main]
    paths: ['action.yml', 'action/**', 'src/StructuredConcurrency.Analyzers/**', '.github/workflows/action.yml']
  pull_request:
    paths: ['action.yml', 'action/**', 'src/StructuredConcurrency.Analyzers/**', '.github/workflows/action.yml']
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build the analyzers
        shell: bash
        run: dotnet build src/StructuredConcurrency.Analyzers -c Release -o "$RUNNER_TEMP/analyzers"

      # No StructuredConcurrency reference, two target frameworks and warnings as errors: one finding, build intact.
      - id: without-package
        uses: ./
        with:
          analyzer-path: ${{ runner.temp }}/analyzers/StructuredConcurrency.Analyzers.dll
          project: action/test/WithoutPackage
      - name: Expect one finding
        shell: bash
        run: test "${{ steps.without-package.outputs.findings }}" = "1"

      - id: clean
        uses: ./
        with:
          analyzer-path: ${{ runner.temp }}/analyzers/StructuredConcurrency.Analyzers.dll
          project: action/test/Clean
      - name: Expect no findings
        shell: bash
        run: test "${{ steps.clean.outputs.findings }}" = "0"

      # Its own analyzers run too; the finding must still be counted once.
      - id: with-package
        uses: ./
        with:
          analyzer-path: ${{ runner.temp }}/analyzers/StructuredConcurrency.Analyzers.dll
          project: action/test/WithPackage
      - name: Expect one finding
        shell: bash
        run: test "${{ steps.with-package.outputs.findings }}" = "1"

      - id: fail-on-findings
        uses: ./
        continue-on-error: true
        with:
          analyzer-path: ${{ runner.temp }}/analyzers/StructuredConcurrency.Analyzers.dll
          project: action/test/WithoutPackage
          fail-on-findings: 'true'
          build-arguments: -c Release
      - name: Expect the step to fail
        shell: bash
        run: test "${{ steps.fail-on-findings.outcome }}" = "failure"

      # The analyzers downloaded from nuget.org, as a user's run gets them, on the project without the package, where
      # nothing else provides them.
      - id: from-nuget
        uses: ./
        with:
          analyzer-version: 0.11.0
          project: action/test/WithoutPackage
      - name: Expect one finding
        shell: bash
        run: test "${{ steps.from-nuget.outputs.findings }}" = "1"
